name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore: &docs-only-changes
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore: *docs-only-changes
  schedule:
    - cron: '30 2 * * 1'  # Weekly security scan

# Cancel in-progress runs when a new workflow run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.9'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.14.4'

jobs:
  # =============================================================================
  # ANALYSIS PHASE - Runs in parallel for all pushes/PRs
  # =============================================================================

  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐦 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 🔧 Create .env file
        run: echo "GOOGLE_MAPS_API_KEY=placeholder" > .env

      - name: 🎨 Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: 🔍 Analyse project source
        run: flutter analyze

      - name: 📝 Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: '**/*.md'

  unit-test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐦 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 🔧 Create .env file
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > .env

      - name: 🧪 Run unit tests
        run: flutter test --exclude-tags=benchmark

  benchmark:
    name: 📊 Benchmark
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐦 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 🔧 Create .env file
        run: echo "GOOGLE_MAPS_API_KEY=test-key-for-benchmarks" > .env

      - name: 📊 Run benchmark tests
        run: flutter test test/benchmark/ --reporter expanded

      - name: 📤 Upload benchmark results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: benchmark-results-${{ github.run_number }}
          path: |
            build/benchmark_results.json
            build/navigation_benchmark_results.json
          retention-days: 30

  security-scan:
    name: 🔒 Security Scan (MobSF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐍 Setup Python for MobSF
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🔒 Run MobSF Security Scan
        uses: MobSF/mobsfscan@main
        with:
          args: '. --sarif --output mobsf-results.sarif || true'

      - name: 📤 Upload MobSF SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: mobsf-results.sarif
          category: mobsf-security-scan

      - name: 📋 Upload scan results as artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mobsf-security-results
          path: mobsf-results.sarif
          retention-days: 30

  # =============================================================================
  # BUILD PHASE - Runs on all pushes and PRs (not scheduled runs)
  # =============================================================================

  build:
    name: 🤖 Build Android
    needs: [lint, unit-test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read

    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐦 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🏗️ Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 📦 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔧 Create .env file
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > .env

      - name: 📋 Extract version info
        id: version
        run: .github/scripts/extract-version.sh ${{ github.run_number }}

      - name: 📝 Generate version config
        run: |
          cat > lib/constants/app_version.dart << EOF
          const String appVersion = '${{ steps.version.outputs.version_name }}';
          const int buildNumber = ${{ steps.version.outputs.version_code }};
          EOF

      - name: 🔑 Setup Android signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/keystore.jks
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: 📱 Build release AAB
        env:
          JAVA_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m -Dorg.gradle.daemon=false
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.version_code }}

      - name: 📤 Upload AAB artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-aab-${{ steps.version.outputs.version_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: 🍎 Build iOS
    needs: [lint, unit-test, security-scan]
    runs-on: macos-latest
    # Temporarily disabled to conserve macOS runner minutes
    if: false
    # Original condition: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 🐦 Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 🔧 Create .env file
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY" > .env

      - name: 🍎 Build iOS (no signing)
        run: flutter build ios --release --no-codesign

      - name: 📤 Upload iOS build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-${{ github.run_number }}
          path: build/ios/iphoneos/Runner.app
          retention-days: 7

  # =============================================================================
  # DEPLOY PHASE - Only runs after successful build on main
  # =============================================================================

  deploy:
    name: 🚀 Deploy to Play Store
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6

      - name: 📥 Download AAB artifact
        uses: actions/download-artifact@v7
        with:
          name: release-aab-${{ needs.build.outputs.version_name }}
          path: build/app/outputs/bundle/release/

      - name: 🔍 Verify AAB and version info
        run: |
          echo "📱 Deploying version: ${{ needs.build.outputs.version_name }}"
          echo "🔢 Version code: ${{ needs.build.outputs.version_code }}"
          echo "📦 AAB file:"
          ls -la build/app/outputs/bundle/release/
          .github/scripts/verify-aab.sh

      - name: 💎 Setup Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: 🔑 Setup Play Store credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: echo "$SERVICE_ACCOUNT_JSON" > android/fastlane/service-account.json

      - name: 📋 Sync shared metadata to Fastlane
        run: .github/scripts/sync-metadata.sh

      - name: 🚀 Deploy to Play Store
        run: bundle exec fastlane internal
        working-directory: android
        env:
          RELEASE_NAME: ${{ needs.build.outputs.version_name }}

      - name: 🧹 Cleanup credentials
        if: always()
        run: rm -f android/fastlane/service-account.json
